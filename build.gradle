plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Minecraft 1.20.1 Forge runs on Java 17. Use the GraalVM 21 compiler while
// emitting Java 17 bytecode so Mixin-transformed Minecraft classes stay loadable.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // Official Mojang mappings for 1.20.1
    mappings channel: mapping_channel, version: mapping_version

    // Default run configurations.
    runs {
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas. "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            // Remap third-party Mixin refmaps (notably GeckoLib) from SRG names
            // to the MCP names used by ForgeGradle's development client.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // GeckoLib for animated parasite entities (deobfuscated for the dev runtime)
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // NOTE: Mixin AP refmap generation doesn't work under FG6 + tsrg2 (tracked as a known issue);
    // dev runtime resolves mixin targets by official names directly, so the AP is omitted for now.
    // annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            geckolib_version       : geckolib_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
}

// Convert ForgeGradle's srg<->official tsrg2 into a legacy SRG mapping file for the Mixin AP
def generateSrgForMixinAp = {
    def root = new File(project.gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config')
    if (!root.exists()) return null
    File src = null
    root.eachDir { dir ->
        if (dir.name.startsWith('1.20.1')) {
            def candidate = new File(dir, 'srg_to_official_1.20.1.tsrg')
            if (candidate.exists()) src = candidate
        }
    }
    if (src == null) return null
    def out = new File(project.buildDir, 'official_to_searge.srg')
    out.parentFile.mkdirs()
    if (!out.exists() || out.lastModified() < src.lastModified()) {
        def currentClass = null
        src.withReader('UTF-8') { reader ->
            out.withWriter('UTF-8') { writer ->
                reader.readLine() // skip tsrg2 header
                reader.eachLine { line ->
                    if (line.trim().isEmpty() || line.trim() == 'static') return
                    if (line.startsWith('\t\t')) return // parameter rows
                    def t = line.trim().split(/\s+/)
                    if (line.startsWith('\t')) {
                        if (currentClass == null) return
                        if (t.size() >= 3 && t[1].startsWith('(')) {
                            // tsrg2 method row: searge desc official
                            writer.writeLine("MD: ${currentClass}/${t[2]} ${currentClass}/${t[0]} ${t[1]} ${t[1]}")
                        } else if (t.size() >= 2) {
                            writer.writeLine("FD: ${currentClass}/${t[1]} ${currentClass}/${t[0]}")
                        }
                    } else {
                        // tsrg2 class row: searge official -> CL: official searge
                        writer.writeLine("CL: ${t[1]} ${t[0]}")
                        currentClass = t[1]
                    }
                }
            }
        }
    }
    return out
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '3000'
    def srg = generateSrgForMixinAp()
    options.compilerArgs << '-AdefaultObfuscationEnv=searge'
    if (srg != null) {
        options.compilerArgs << "-AreobfSrgFile=${srg.absolutePath}"
    }
    options.compilerArgs << '-AoutRefMapFile=csrp.refmap.json'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
