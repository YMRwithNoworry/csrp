# This is the mods.toml for the 1.20.1 Forge port.
modLoader = "javafml" #mandatory
# A version range to match for said Forge loader - for FML it's the major version.
loaderVersion = "${loader_version_range}" #mandatory
# The license for the mod.
license = "${mod_license}"
# A list of mods
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
authors = "${mod_authors}"
description = '''${mod_description}'''

# A dependency - use the . to indicate dependency for a specific modid.
[[dependencies."${mod_id}"]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory
versionRange = "${forge_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"

# Here's another dependency
[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "geckolib"
mandatory = true
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "citadel"
mandatory = true
versionRange = "[${citadel_version},)"
ordering = "AFTER"
side = "BOTH"
