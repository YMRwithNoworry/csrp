name: Build CSRP

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      minecraft_version: ${{ steps.metadata.outputs.minecraft_version }}
      neo_version: ${{ steps.metadata.outputs.neo_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: bash ./gradlew --no-daemon build

      - name: Prepare release files
        id: metadata
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n 1)
          neo_version=$(sed -n 's/^neo_version=//p' gradle.properties | head -n 1)
          jar_path=$(find build/libs -maxdepth 1 -type f -name 'csrp-*.jar' -print -quit)

          test -n "$mod_version"
          test -n "$minecraft_version"
          test -n "$neo_version"
          test -n "$jar_path"

          asset_name="csrp-${mod_version}-mc${minecraft_version}-neoforge${neo_version}.jar"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_tag="csrp-${mod_version}-build.${GITHUB_RUN_NUMBER}"
          else
            release_tag="csrp-${mod_version}-test-build.${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p release-files
          cp "$jar_path" "release-files/$asset_name"

          {
            printf '# CSRP %s\n\n' "$mod_version"
            printf -- '- Minecraft: %s\n' "$minecraft_version"
            printf -- '- NeoForge: %s\n\n' "$neo_version"
            printf '## Changes in this push\n\n'
          } > release-files/release-notes.md

          if [[ -n "${PUSH_BEFORE:-}" && ! "$PUSH_BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            git log --reverse --format='- %s (`%h`)' "$PUSH_BEFORE..$GITHUB_SHA" \
              >> release-files/release-notes.md
          else
            git log -1 --format='- %s (`%h`)' "$GITHUB_SHA" \
              >> release-files/release-notes.md
          fi

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "neo_version=$neo_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: csrp-${{ steps.metadata.outputs.mod_version }}-mc${{ steps.metadata.outputs.minecraft_version }}-neoforge${{ steps.metadata.outputs.neo_version }}
          path: release-files/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: csrp-release-notes
          path: release-files/release-notes.md
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: csrp-${{ needs.build.outputs.mod_version }}-mc${{ needs.build.outputs.minecraft_version }}-neoforge${{ needs.build.outputs.neo_version }}
          path: release-files

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: csrp-release-notes
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: CSRP ${{ needs.build.outputs.mod_version }} (build ${{ github.run_number }})
          body_path: release-files/release-notes.md
          files: release-files/*.jar
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          target_commitish: ${{ github.sha }}
